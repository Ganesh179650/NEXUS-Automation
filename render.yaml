services:
  - type: web
    name: nexus-home-iot
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: nexus-telemetry-daemon
    env: node
    buildCommand: npm install
    startCommand: node server.js

